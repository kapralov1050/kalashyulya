# Preview на Vercel (UI-only).
#
# Два пути деплоя (выбирается автоматически):
#
# A. Через Vercel GitHub Integration (рекомендуется)
#    В Vercel UI → Project Settings → Git → "Deploy on push to main".
#    Integration сам собирает и деплоит. CI просто валидирует что сборка проходит.
#
# B. Через Vercel CLI (fallback)
#    Если NITRO_PRESET=vercel задан в env workflow-а — CI деплоит сам.
#    Нужны GH Secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
#
# На preview работает:
#   - Главная, каталог, корзина, чекаут (UI)
#   - Картинки с Yandex Object Storage
# На preview НЕ работает (нужен VPS prod):
#   - SQLite (нет persistent FS) → читаем из server/fixtures/*.json
#   - Реальные заказы, админка, YooKassa payment, Telegram/Email

name: Vercel Preview (UI)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci --include=optional --ignore-scripts --no-audit --no-fund

      - name: Build (Nitro preset=vercel)
        env:
          NITRO_PRESET: vercel
          NUXT_PUBLIC_SITE_URL: https://kalashyulya.vercel.app
        run: npx nuxt build

      # Путь A: Vercel CLI deploy (нужны secrets)
      - name: Deploy via Vercel CLI
        if: ${{ env.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ ! -d ".vercel/output" ]; then
            echo "::error::Build output .vercel/output not found. Check build step."
            exit 1
          fi
          npx vercel deploy --prebuilt --archive=tgz --yes \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_ORG_ID" \
            --project "$VERCEL_PROJECT_ID"
          echo "✓ Vercel preview deployed via CLI"

      # Путь B (по умолчанию): только валидация билда, деплоит Vercel GitHub Integration
      - name: Validate build output (no CLI deploy)
        if: ${{ env.VERCEL_TOKEN == '' || env.VERCEL_TOKEN == null }}
        run: |
          if [ ! -d ".vercel/output" ]; then
            echo "::error::Build output .vercel/output not found. Check build step."
            exit 1
          fi
          echo "✓ Build output exists at .vercel/output/"
          echo "Vercel GitHub Integration should deploy this build automatically."
          echo "(Чтобы CI сам деплоил, добавь secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID)"

      - name: List deployments (informational)
        if: ${{ always() && env.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          npx vercel ls --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --project "$VERCEL_PROJECT_ID" 2>/dev/null || true
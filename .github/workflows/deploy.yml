name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - prod
  pull_request:
    branches:
      - main
      - prod
  repository_dispatch:
    types: [deploy]

jobs:
  # Job для проверки кода (линтеры, тесты, typecheck)
  test:
    runs-on: ubuntu-latest
    env:
      npm_config_target_platform: linux
      npm_config_target_arch: x64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint Fix
        run: npm run lint:fix --if-present

      - name: ESLint Check
        run: npm run lint
        continue-on-error: false

      - name: Prettier Format Fix
        run: npm run format --if-present

      - name: Prettier Format Check
        run: npm run format:check
        continue-on-error: false

      - name: TypeScript Check
        run: npm run typecheck
        continue-on-error: false

      - name: Run tests
        run: npm run test:run

  # Job для деплоя на prod (VPS через SSH)
  deploy-prod:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prod' || github.event_name == 'repository_dispatch'
    environment: production
    env:
      npm_config_target_platform: linux
      npm_config_target_arch: x64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Create .env on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cat > /var/www/kalashyulya/.env <<'ENV'
            FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
            FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
            FIREBASE_DATABASE_URL=${{ secrets.FIREBASE_DATABASE_URL }}
            FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
            FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
            FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
            FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
            FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }}
            NUXT_PUBLIC_SITE_URL=${{ secrets.NUXT_PUBLIC_SITE_URL }}
            NUXT_PUBLIC_CLOUD_FUNCTION_TELEGRAM_URL=${{ secrets.NUXT_PUBLIC_CLOUD_FUNCTION_TELEGRAM_URL }}
            NUXT_PUBLIC_CLOUD_FUNCTION_EMAIL_URL=${{ secrets.NUXT_PUBLIC_CLOUD_FUNCTION_EMAIL_URL }}
            NUXT_PUBLIC_CLOUD_FUNCTION_EMAIL_NOTIFIER=${{ secrets.NUXT_PUBLIC_CLOUD_FUNCTION_EMAIL_NOTIFIER }}
            NUXT_PUBLIC_CLOUD_FUNCTION_UPLOAD_LOCALES=${{ secrets.NUXT_PUBLIC_CLOUD_FUNCTION_UPLOAD_LOCALES }}
            NUXT_PUBLIC_BUCKET_NAME=${{ secrets.NUXT_PUBLIC_BUCKET_NAME }}
            NUXT_PUBLIC_DADATA_API_KEY=${{ secrets.NUXT_PUBLIC_DADATA_API_KEY }}
            NUXT_PUBLIC_DADATA_SECRET_KEY=${{ secrets.NUXT_PUBLIC_DADATA_SECRET_KEY }}
            NUXT_PUBLIC_CLOUD_FUNCTION_UPLOAD_STATS=${{ secrets.NUXT_PUBLIC_CLOUD_FUNCTION_UPLOAD_STATS }}
            NUXT_PUBLIC_STATS=${{ secrets.NUXT_PUBLIC_STATS }}
            NUXT_PUBLIC_LOCALES=${{ secrets.NUXT_PUBLIC_LOCALES }}
            NUXT_PUBLIC_CLOUD_FUNCTION_YOOKASSA_CREATE_PAYMENT=${{ secrets.NUXT_PUBLIC_CLOUD_FUNCTION_YOOKASSA_CREATE_PAYMENT }}
            NUXT_PUBLIC_CLOUD_FUNCTION_PDF_GENERATOR_URL=${{ secrets.NUXT_PUBLIC_CLOUD_FUNCTION_PDF_GENERATOR_URL }}
            ENV
            chmod 600 /var/www/kalashyulya/.env
            chown kalashyulya:kalashyulya /var/www/kalashyulya/.env

      - name: Sync build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ".output/"
          target: "/var/www/kalashyulya/.output/"
          strip_components: 1

      - name: Restart Nitro and healthcheck
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo systemctl restart kalashyulya-nitro
            sleep 3
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/)
            if [ "$STATUS" = "200" ]; then
              echo "OK: Nitro healthy (HTTP $STATUS)"
            else
              echo "FAIL: Nitro returned HTTP $STATUS"
              sudo systemctl status kalashyulya-nitro --no-pager
              exit 1
            fi

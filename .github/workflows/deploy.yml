name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - prod
  pull_request:
    branches:
      - main
      - prod
  repository_dispatch:
    types: [deploy]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci

      - name: ESLint Fix
        run: npm run lint:fix --if-present

      - name: ESLint Check
        run: npm run lint
        continue-on-error: false

      - name: Prettier Format Fix
        run: npm run format --if-present

      - name: Prettier Format Check
        run: npm run format:check
        continue-on-error: false

      - name: TypeScript Check
        run: npm run typecheck
        continue-on-error: false

      - name: Run tests
        run: npm run test:run

  deploy-prod:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prod' || github.event_name == 'repository_dispatch'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          tags: kalashyulya:nitro
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image to tar
        run: |
          docker save kalashyulya:nitro > /tmp/kalashyulya.tar
          ls -lh /tmp/kalashyulya.tar

      - name: Copy image to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "/tmp/kalashyulya.tar"
          target: "/tmp/kalashyulya.tar"

      - name: Copy .env to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ".env"
          target: "/tmp/.env"

      - name: Deploy via Docker
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            docker load < /tmp/kalashyulya.tar

            docker stop kalashyulya || true
            docker rm kalashyulya || true

            install -d -m 0755 /var/www/kalashyulya/env
            mv /tmp/.env /var/www/kalashyulya/env/.env
            chmod 600 /var/www/kalashyulya/env/.env

            docker run -d \
              --name kalashyulya \
              --restart unless-stopped \
              -p 127.0.0.1:3000:3000 \
              --env-file /var/www/kalashyulya/env/.env \
              kalashyulya:nitro

            rm -f /tmp/kalashyulya.tar

            sleep 5
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)
            if [ "$STATUS" = "200" ]; then
              echo "OK: Nitro container healthy (HTTP $STATUS)"
            else
              echo "FAIL: Nitro container returned HTTP $STATUS"
              docker logs kalashyulya --tail 50
              exit 1
            fi

      - name: Cleanup old images
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker image prune -f
            echo "Remaining images:"
            docker images

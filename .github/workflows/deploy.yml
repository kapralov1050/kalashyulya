name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - prod
  pull_request:
    branches:
      - main
      - prod
  repository_dispatch:
    types: [deploy]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci --os=linux --cpu=x64 --include=optional --ignore-scripts --no-audit --no-fund

      - name: Generate Nuxt types
        run: npx nuxt prepare

      - name: ESLint Fix
        run: npm run lint:fix --if-present

      - name: ESLint Check
        run: npm run lint

      - name: Prettier Format Fix
        run: npm run format --if-present

      - name: Prettier Format Check
        run: npm run format:check

      - name: TypeScript Check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

  deploy-prod:
    needs: test
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/prod' || github.event_name == 'repository_dispatch'

    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.prod
          tags: ghcr.io/kapralov1050/kalashyulya:nitro
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # FIREBASE_* build-args больше не нужны — фронт не использует Firebase RTDB,
          # данные мигрированы в SQLite (см. docs/migration/sqlite-from-firebase.md).

      - name: Make GHCR package public
        run: |
          gh api -X PATCH /user/packages/container/kalashyulya/visibility \
            -H "Accept: application/vnd.github+json" \
            -f visibility=public \
            || echo "Package may already be public or not exist yet"

      - name: Setup SSH key
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ssh"
          printf '%s' "${{ secrets.VPS_SSH_KEY }}" > "$GITHUB_WORKSPACE/.ssh/deploy_key"
          chmod 600 "$GITHUB_WORKSPACE/.ssh/deploy_key"
          sed -i.bak 's/[[:space:]]*$//' "$GITHUB_WORKSPACE/.ssh/deploy_key" && rm "$GITHUB_WORKSPACE/.ssh/deploy_key.bak"
          [ "$(tail -c 1 "$GITHUB_WORKSPACE/.ssh/deploy_key" | wc -l)" -eq 0 ] && echo "" >> "$GITHUB_WORKSPACE/.ssh/deploy_key"
          echo "✓ SSH key written ($(wc -c < "$GITHUB_WORKSPACE/.ssh/deploy_key") bytes)"
          cat "$GITHUB_WORKSPACE/.ssh/deploy_key" | head -1

      - name: Write .env to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: .ssh/deploy_key
          command_timeout: 5m
          script: |
            set -e

            # /var/www/kalashyulya dir exists from previous deploys

            cat > /var/www/kalashyulya/.env <<EOF
            NUXT_PUBLIC_BUCKET_NAME=${{ secrets.NUXT_PUBLIC_BUCKET_NAME }}
            NUXT_PUBLIC_CLOUD_FUNCTION_DELETE_PRODUCT_FILE=${{ secrets.NUXT_PUBLIC_CLOUD_FUNCTION_DELETE_PRODUCT_FILE }}
            NUXT_PUBLIC_CLOUD_FUNCTION_EMAIL_NOTIFIER=${{ secrets.NUXT_PUBLIC_CLOUD_FUNCTION_EMAIL_NOTIFIER }}
            NUXT_PUBLIC_CLOUD_FUNCTION_EMAIL_URL=${{ secrets.NUXT_PUBLIC_CLOUD_FUNCTION_EMAIL_URL }}
            NUXT_PUBLIC_CLOUD_FUNCTION_PDF_GENERATOR_URL=${{ secrets.NUXT_PUBLIC_CLOUD_FUNCTION_PDF_GENERATOR_URL }}
            NUXT_PUBLIC_CLOUD_FUNCTION_TELEGRAM_URL=${{ secrets.NUXT_PUBLIC_CLOUD_FUNCTION_TELEGRAM_URL }}
            NUXT_PUBLIC_CLOUD_FUNCTION_UPLOAD_LOCALES=${{ secrets.NUXT_PUBLIC_CLOUD_FUNCTION_UPLOAD_LOCALES }}
            NUXT_PUBLIC_CLOUD_FUNCTION_UPLOAD_PRODUCT_URL=${{ secrets.NUXT_PUBLIC_CLOUD_FUNCTION_UPLOAD_PRODUCT_URL }}
            NUXT_PUBLIC_CLOUD_FUNCTION_UPLOAD_STATS=${{ secrets.NUXT_PUBLIC_CLOUD_FUNCTION_UPLOAD_STATS }}
            NUXT_PUBLIC_CLOUD_FUNCTION_YOOKASSA_CREATE_PAYMENT=${{ secrets.NUXT_PUBLIC_CLOUD_FUNCTION_YOOKASSA_CREATE_PAYMENT }}
            NUXT_PUBLIC_DADATA_API_KEY=${{ secrets.NUXT_PUBLIC_DADATA_API_KEY }}
            NUXT_PUBLIC_DADATA_SECRET_KEY=${{ secrets.NUXT_PUBLIC_DADATA_SECRET_KEY }}
            NUXT_PUBLIC_LOCALES=${{ secrets.NUXT_PUBLIC_LOCALES }}
            NUXT_PUBLIC_SITE_URL=${{ secrets.NUXT_PUBLIC_SITE_URL }}
            NUXT_PUBLIC_STATS=${{ secrets.NUXT_PUBLIC_STATS }}
            # Путь к SQLite внутри контейнера.
            # data.db лежит на хосте в /var/lib/kalashyulya/data.db,
            # пробрасывается через volume в контейнер.
            SQLITE_PATH=/var/lib/kalashyulya/data.db
            EOF
            chmod 600 /var/www/kalashyulya/.env
            echo ".env written to /var/www/kalashyulya/.env ($(wc -l < /var/www/kalashyulya/.env) lines)"

      - name: Pull image and deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: .ssh/deploy_key
          command_timeout: 20m
          script: |
            set -e

            # Создаём /var/lib/kalashyulya (uid 1001 = nitro в контейнере).
            sudo mkdir -p /var/lib/kalashyulya
            sudo chown -R 1001:1001 /var/lib/kalashyulya
            sudo chmod 775 /var/lib/kalashyulya

            docker pull ghcr.io/kapralov1050/kalashyulya:nitro

            docker stop kalashyulya 2>/dev/null || true
            docker rm kalashyulya 2>/dev/null || true

            docker run -d \
              --name kalashyulya \
              --restart unless-stopped \
              -p 127.0.0.1:3000:3000 \
              -v /var/lib/kalashyulya:/var/lib/kalashyulya \
              --env-file /var/www/kalashyulya/.env \
              ghcr.io/kapralov1050/kalashyulya:nitro

            sleep 10

            # Скопировать static assets
            rm -rf /var/www/kalashyulya/.output
            mkdir -p /var/www/kalashyulya/.output
            docker cp kalashyulya:/app/.output/public /var/www/kalashyulya/.output/public 2>/dev/null || true

            # Сохранить лог в файл (потом прочитаем в GitHub Actions)
            DEPLOY_LOG=/tmp/kalashyulya-deploy.log
            {
              echo "=== DEPLOY RUN $(date -Iseconds) ==="
              echo "--- container status ---"
              docker ps -a --filter name=kalashyulya --format "{{.Names}}: {{.Status}}"
              echo "--- container logs (last 50) ---"
              docker logs kalashyulya --tail 50 2>&1 || true
              echo "--- smoke: main page ---"
              curl -s -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:3000/ || echo "000"
              echo "--- smoke: API products ---"
              curl -s http://127.0.0.1:3000/api/products 2>/dev/null | head -c 200 || echo "fail"
              echo ""
              echo "--- end ---"
            } > "$DEPLOY_LOG" 2>&1

            # ВАЖНО: всегда печатаем содержимое лога, чтобы оно попало в GitHub Actions
            cat "$DEPLOY_LOG"

            # Не падаем на smoke test — это инфо, главное что новый код задеплоен.
            # Если что-то критичное — увидим в логах выше.
            exit 0

      - name: Cleanup old images
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: .ssh/deploy_key
          script: |
            docker image prune -f
            echo "Remaining images:"
            docker images
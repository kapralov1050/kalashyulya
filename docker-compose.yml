services:
  nuxt-app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # НЕ монтируем ./:/app — иначе перезапишется .output из образа.
      # Для live-reload в dev-режиме нужен отдельный сервис с `npm run dev`.
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - SQLITE_PATH=/tmp/data.db
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    stop_grace_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
        compress: "true"

  nuxt-app-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "3001:3000"
    env_file:
      - .env

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Placed — Animation Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #f1f5f9;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .title {
      color: #64748b;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .previews {
      display: flex;
      gap: 32px;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 40px 48px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 2px 20px rgba(0,0,0,0.08);
    }

    .card--dark {
      background: #0f172a;
    }

    .caption {
      font-size: 13px;
      color: #64748b;
      font-weight: 500;
    }

    .card--dark .caption {
      color: #94a3b8;
    }

    .meta {
      color: #94a3b8;
      font-size: 11px;
      letter-spacing: 0.3px;
    }

    /* ── Animation ── */

    .bag-main {
      transform-box: fill-box;
      transform-origin: center;
      animation: bagAnim 2.5s ease-out infinite;
    }

    .check-badge {
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
      animation: checkPop 2.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }

    /*
      Phase 1 (0–44%  = 0–1.1s):  spring bounce in
      Phase 2 (20–42% = 0.5–1.05s): checkmark pops in (overlaps)
      Phase 3 (56–80% = 1.4–2.0s): gentle pulse
      Phase 4 (80–100%): hold before loop
    */
    @keyframes bagAnim {
      0%   { transform: scale(0.8);  }
      12%  { transform: scale(1.09); }
      22%  { transform: scale(0.96); }
      30%  { transform: scale(1.03); }
      38%  { transform: scale(0.99); }
      44%  { transform: scale(1.0);  }
      56%  { transform: scale(1.0);  }
      68%  { transform: scale(1.05); }
      80%  { transform: scale(1.0);  }
      100% { transform: scale(1.0);  }
    }

    @keyframes checkPop {
      0%   { opacity: 0; transform: scale(0.3); }
      20%  { opacity: 0; transform: scale(0.3); }
      42%  { opacity: 1; transform: scale(1.0); }
      100% { opacity: 1; transform: scale(1.0); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <span class="title">Animation Preview — Order Placed</span>

    <div class="previews">

      <!-- Light -->
      <div class="card">
        <svg width="80" height="80" viewBox="0 0 80 80"
             xmlns="http://www.w3.org/2000/svg" overflow="visible">
          <g class="bag-main">
            <!-- Bag body -->
            <rect x="14" y="28" width="52" height="42" rx="5"
                  fill="none" stroke="#06b6d4" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Handle -->
            <path d="M 26 28 C 26 13 54 13 54 28"
                  fill="none" stroke="#06b6d4" stroke-width="2"
                  stroke-linecap="round"/>
            <!-- Checkmark badge -->
            <g class="check-badge">
              <circle cx="63" cy="20" r="11" fill="white"/>
              <circle cx="63" cy="20" r="9.5" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
              <polyline points="58,20 62,24.5 69.5,14.5"
                        fill="none" stroke="#06b6d4" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round"/>
            </g>
          </g>
        </svg>
        <span class="caption">Заказ оформлен</span>
      </div>

      <!-- Dark -->
      <div class="card card--dark">
        <svg width="80" height="80" viewBox="0 0 80 80"
             xmlns="http://www.w3.org/2000/svg" overflow="visible">
          <g class="bag-main">
            <!-- Bag body -->
            <rect x="14" y="28" width="52" height="42" rx="5"
                  fill="none" stroke="#06b6d4" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Handle -->
            <path d="M 26 28 C 26 13 54 13 54 28"
                  fill="none" stroke="#06b6d4" stroke-width="2"
                  stroke-linecap="round"/>
            <!-- Checkmark badge -->
            <g class="check-badge">
              <circle cx="63" cy="20" r="11" fill="#0f172a"/>
              <circle cx="63" cy="20" r="9.5" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
              <polyline points="58,20 62,24.5 69.5,14.5"
                        fill="none" stroke="#06b6d4" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round"/>
            </g>
          </g>
        </svg>
        <span class="caption">Заказ оформлен</span>
      </div>

    </div>

    <span class="meta">80×80px · stroke #06b6d4 · loop 2.5s · ease-out elastic</span>
  </div>
</body>
</html>

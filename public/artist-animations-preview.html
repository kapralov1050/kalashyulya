<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist Animations — Timeline Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
      gap: 40px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    h1 {
      color: #64748b;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .row {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 32px 36px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 2px 20px rgba(0,0,0,0.08);
    }

    .card--dark {
      background: #0f172a;
    }

    .caption {
      font-size: 12px;
      color: #64748b;
      font-weight: 500;
    }

    .card--dark .caption {
      color: #94a3b8;
    }

    .step-label {
      font-size: 10px;
      color: #cbd5e1;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ── Step 1 — Order ("right now") ── */

    .l-arm {
      transform-origin: 33px 30px;
      animation: l-arm-anim 2.5s linear infinite;
    }
    .r-arm {
      transform-origin: 47px 30px;
      animation: r-arm-anim 2.5s linear infinite;
    }
    .body-grp {
      transform-origin: 40px 33.5px;
      animation: body-anim 2.5s linear infinite;
    }

    @media (prefers-reduced-motion: no-preference) {
      @keyframes l-arm-anim {
        0%   { transform: rotate(-30deg); animation-timing-function: ease-out; }
        20%  { transform: rotate(-165deg); animation-timing-function: ease-in-out; }
        26%  { transform: rotate(-147deg); animation-timing-function: ease-in-out; }
        32%  { transform: rotate(-153deg); }
        48%  { transform: rotate(-30deg); animation-timing-function: ease-in; }
        100% { transform: rotate(-30deg); }
      }

      @keyframes r-arm-anim {
        0%   { transform: rotate(30deg); animation-timing-function: ease-out; }
        20%  { transform: rotate(165deg); animation-timing-function: ease-in-out; }
        26%  { transform: rotate(147deg); animation-timing-function: ease-in-out; }
        32%  { transform: rotate(153deg); }
        48%  { transform: rotate(30deg); animation-timing-function: ease-in; }
        100% { transform: rotate(30deg); }
      }

      @keyframes body-anim {
        0%, 16%, 52%, 100% { transform: scale(1); }
        28%  { transform: scale(1.05); animation-timing-function: ease-in-out; }
        36%  { transform: scale(1); }
      }
    }
  </style>
</head>
<body>

  <h1>Artist Timeline Animations</h1>

  <div class="row">

    <!-- Step 1 light -->
    <div class="card">
      <span class="step-label">Step 1</span>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" overflow="visible">
        <ellipse cx="40" cy="11" rx="5" ry="3.5" fill="#5C3D2E"/>
        <circle cx="40" cy="20" r="7" fill="#FDDCB5"/>
        <g class="body-grp">
          <rect x="33" y="27" width="14" height="13" rx="3" fill="#06b6d4"/>
        </g>
        <line x1="37" y1="40" x2="34" y2="56" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
        <line x1="43" y1="40" x2="46" y2="56" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
        <g class="l-arm">
          <line x1="33" y1="30" x2="33" y2="42" stroke="#FDDCB5" stroke-width="2" stroke-linecap="round"/>
        </g>
        <g class="r-arm">
          <line x1="47" y1="30" x2="47" y2="42" stroke="#FDDCB5" stroke-width="2" stroke-linecap="round"/>
          <line x1="47" y1="43" x2="47" y2="51" stroke="#5C3D2E" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="47" cy="52.5" r="2" fill="#06b6d4"/>
        </g>
      </svg>
      <span class="caption">Заказ оформлен</span>
    </div>

    <!-- Step 1 dark -->
    <div class="card card--dark">
      <span class="step-label">Step 1</span>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" overflow="visible">
        <ellipse cx="40" cy="11" rx="5" ry="3.5" fill="#5C3D2E"/>
        <circle cx="40" cy="20" r="7" fill="#FDDCB5"/>
        <g class="body-grp">
          <rect x="33" y="27" width="14" height="13" rx="3" fill="#06b6d4"/>
        </g>
        <line x1="37" y1="40" x2="34" y2="56" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
        <line x1="43" y1="40" x2="46" y2="56" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
        <g class="l-arm">
          <line x1="33" y1="30" x2="33" y2="42" stroke="#FDDCB5" stroke-width="2" stroke-linecap="round"/>
        </g>
        <g class="r-arm">
          <line x1="47" y1="30" x2="47" y2="42" stroke="#FDDCB5" stroke-width="2" stroke-linecap="round"/>
          <line x1="47" y1="43" x2="47" y2="51" stroke="#5C3D2E" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="47" cy="52.5" r="2" fill="#06b6d4"/>
        </g>
      </svg>
      <span class="caption">Заказ оформлен</span>
    </div>

  </div>

  <span style="font-size:11px;color:#94a3b8">80×80px · CSS @keyframes only · loop 2.5s</span>

</body>
</html>
